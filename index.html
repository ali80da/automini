<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Routinet Nexus</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --primary-accent: #007AFF;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
                --glass-bg: rgba(20, 20, 20, 0.7);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-primary: #ffffff;
                --text-secondary: #a1a1a6;
            }
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            padding: 24px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(45deg, #007AFF, #5AC8FA);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.3);
        }

        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #fff;
            object-fit: cover;
            border: 4px solid var(--glass-bg);
        }

        h1 { font-weight: 800; font-size: 32px; margin: 0; letter-spacing: -1px; }
        .subtitle { color: var(--text-secondary); font-size: 16px; margin-top: 8px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease;
        }

        .input-group { margin-top: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid transparent;
            background: rgba(120, 120, 128, 0.1);
            color: var(--text-primary);
            font-size: 17px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus { background: rgba(120, 120, 128, 0.15); border-color: var(--primary-accent); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="avatar-ring">
                <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User" class="avatar-img" id="user-avatar">
            </div>
            <h1 id="greeting">Welcome</h1>
            <p class="subtitle">Routinet Secure Gateway v3.0</p>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; font-weight: 600;">Command Center</h3>
            <div class="input-group">
                <label for="command">Enter your request</label>
                <input type="text" id="command" placeholder="e.g., Start automation..." autocomplete="off">
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // 1. Initialization & Expansion
        tg.expand();
        tg.ready();

        // 2. User Data Handling
        const user = tg.initDataUnsafe.user;
        const greetingEl = document.getElementById('greeting');
        const avatarEl = document.getElementById('user-avatar');

        if (user) {
            greetingEl.innerText = `Hello, ${user.first_name}`;
            avatarEl.src = user.photo_url || `https://ui-avatars.com/api/?name=${user.first_name}&background=random`;
        }

        // 3. Main Button Setup (The Primary Interaction Point)
        tg.MainButton.setParams({
            text: 'EXECUTE COMMAND',
            color: '#007AFF',
            text_color: '#FFFFFF',
            is_active: false, // Disabled until input is provided
            is_visible: true
        });

        // 4. Real-time Input Validation
        const commandInput = document.getElementById('command');
        
        commandInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 0) {
                tg.MainButton.setText(`RUN: ${val.toUpperCase()}`);
                tg.MainButton.enable();
            } else {
                tg.MainButton.setText('EXECUTE COMMAND');
                tg.MainButton.disable();
            }
        });

        // 5. Data Submission Logic
        tg.MainButton.onClick(() => {
            const payload = {
                action: 'webapp_command',
                data: commandInput.value.trim(),
                userId: user ? user.id : null,
                timestamp: new Date().toISOString()
            };

            // Haptic Feedback for Premium Feel
            tg.HapticFeedback.notificationOccurred('success');
            
            // Send to Bot
            tg.sendData(JSON.stringify(payload));
        });

        // 6. Dynamic Theme Adaptation
        tg.onEvent('themeChanged', function() {
            document.documentElement.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${tg.themeParams.bg_color} 0%, ${tg.themeParams.secondary_bg_color} 100%)`);
        });
    </script>
</body>
</html>
